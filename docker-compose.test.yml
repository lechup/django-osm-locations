# Services the test suite needs: PostGIS for the models, OpenSearch for the
# search index and the API built on it.
#
#   docker compose -f docker-compose.test.yml up -d
#   pytest                 # unit tests
#   pytest -m search       # index and API integration tests
#   docker compose -f docker-compose.test.yml down -v
services:
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: locations_test
      POSTGRES_USER: locations
      POSTGRES_PASSWORD: locations
    ports:
      - "${LOCATIONS_TEST_DB_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U locations -d locations_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data

  opensearch:
    image: opensearchproject/opensearch:2.18.0
    environment:
      discovery.type: single-node
      # a test cluster: no TLS, no auth, small heap
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      bootstrap.memory_lock: "false"
    ports:
      - "${LOCATIONS_TEST_OPENSEARCH_PORT:-59200}:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 40
    ulimits:
      memlock: -1
      nofile:
        soft: 65536
        hard: 65536
