# A persistent local stack for real work: importing a whole country, trying
# queries against real data, measuring.
#
# Unlike docker-compose.test.yml this keeps its data in named volumes rather
# than tmpfs, uses its own project name and its own ports, so both stacks can
# run side by side without colliding.
#
#   docker compose -f docker-compose.local.yml up -d
#   ...
#   docker compose -f docker-compose.local.yml down      # keeps the data
#   docker compose -f docker-compose.local.yml down -v   # deletes it
name: locations-local

services:
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: locations
      POSTGRES_USER: locations
      POSTGRES_PASSWORD: locations
    ports:
      - "${LOCATIONS_LOCAL_DB_PORT:-55433}:5432"
    volumes:
      - postgis-data:/var/lib/postgresql/data
    # Tuned for bulk loading rather than for a busy server. synchronous_commit
    # is off because an interrupted import is re-run, not recovered -- it costs
    # the last few transactions on a crash, never consistency.
    #
    # These are sized for this container's 8g limit, not for the host: because
    # the limit is hard, work_mem can only trade page cache for working memory
    # inside that budget, and it cannot squeeze the desktop. Measured mid-import
    # the container sits at its limit with 7.69GB of it droppable page cache and
    # 0.09GB anonymous, so there is room to spend.
    #
    # work_mem is per sort or hash node AND per connection, so it multiplies
    # twice. 256MB is safe here because one management command is the only heavy
    # client; max_connections is 100, and pointing a web application at this
    # database would make the same figure catastrophic. Do not copy it into a
    # production configuration.
    #
    # maintenance_work_mem is one operation at a time in practice -- an index
    # build, a manual VACUUM -- which makes it the cheapest one to raise.
    # autovacuum_work_mem stays where it is, because that one does multiply by
    # the worker count, and shared_buffers stays at 1GB because it is shmem: a
    # bigger figure is memory the kernel cannot reclaim when the host needs it.
    command: >
      postgres
      -c shared_buffers=1GB
      -c work_mem=256MB
      -c maintenance_work_mem=1GB
      -c autovacuum_work_mem=256MB
      -c autovacuum_max_workers=2
      -c max_wal_size=4GB
      -c checkpoint_timeout=30min
      -c synchronous_commit=off
      -c random_page_cost=1.1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U locations -d locations"]
      interval: 5s
      timeout: 5s
      retries: 40
    shm_size: 1gb
    # Docker runs under system.slice, the desktop under user.slice, and
    # systemd-oomd is configured to kill the *user* slice when it stalls on
    # reclaim -- so an uncapped container here gets the session killed rather
    # than itself. It has happened twice. The cap is the structural fix: what
    # postgres cannot allocate, it cannot take from the desktop.
    mem_limit: 8g

  opensearch:
    image: opensearchproject/opensearch:2.18.0
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      # a country's worth of geo_shape documents needs more than the test heap;
      # 3g leaves headroom for Poland and the UK in the same cluster
      OPENSEARCH_JAVA_OPTS: "-Xms3g -Xmx3g"
      bootstrap.memory_lock: "true"
      # Snapshots can only be written to a directory the cluster has been
      # told about up front; there is no way to nominate one at call time.
      # This is what locations_export_snapshot writes into, and what a
      # consumer restoring a published index has to configure too.
      path.repo: /snapshots
    ports:
      - "${LOCATIONS_LOCAL_OPENSEARCH_PORT:-59201}:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
      # A bind mount rather than a named volume: the point of a snapshot is
      # to leave the container, and tarring a named volume means another
      # container to do it with.
      - ./local/snapshots:/snapshots
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60
    ulimits:
      memlock: -1
      nofile:
        soft: 65536
        hard: 65536
    # 3g heap plus Lucene's off-heap mmap; see the postgis note on why a
    # container here needs a ceiling at all.
    mem_limit: 6g

volumes:
  postgis-data:
  opensearch-data:
