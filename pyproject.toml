[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-osm-locations"
version = "0.3.0"
description = "Django app that imports OpenStreetMap extracts into a PostGIS location hierarchy and serves them over a REST API."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Leszek Piątek", email = "lpiatek@gmail.com" }]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
keywords = ["django", "openstreetmap", "osm", "postgis", "gis", "geodjango"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]

# Core runtime: the models, admin and middleware only.
dependencies = [
    "Django>=4.2",
    "anyascii>=0.3",
    # progress reporting, used by the recalculate/merge management commands
    "tqdm>=4.60",
]

[project.optional-dependencies]
# Search index built from PostGIS.
search = [
    "opensearch-py>=2.4",
]

# REST API layer (django_osm_locations.api), which reads the search index.
api = [
    "django-osm-locations[search]",
    "djangorestframework>=3.14",
]

# OSM import pipeline (the locations_import management command).
importers = [
    "requests>=2.25",
    "Shapely>=1.8",
    "osmium>=3.6",
]

# Loading a coastline for locations_clip_borders_to_land. pyogrio bundles
# GDAL as a wheel, so the shapefile can be read without apt-installing
# gdal-bin for the sake of one ogr2ogr invocation.
coastline = [
    "pyogrio>=0.7",
]

dev = [
    "django-osm-locations[api,search,importers,coastline]",
    # The package leaves the database driver to the project using it; the test
    # and local stacks need one.
    "psycopg2-binary>=2.9",
    "pytest>=7.0",
    "pytest-django>=4.5",
]

[project.urls]
Homepage = "https://github.com/lechup/django-osm-locations"
Source = "https://github.com/lechup/django-osm-locations"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
# the repository root, where tests.settings is: plain `pytest` does not add it
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["error::SyntaxWarning"]
# The .pbf integration test parses a real extract and takes ~20s, needs a
# Python 3 build of imposm.parser and the extract itself, so it is opt-in:
#   pytest -m pbf
markers = [
    "pbf: parses a real OSM extract (slow, opt-in)",
    "search: needs the OpenSearch container (opt-in)",
]
addopts = "-m 'not pbf and not search'"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
django_osm_locations = ["fixtures/*.json"]
