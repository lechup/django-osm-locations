[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-osm-locations"
version = "0.1.0"
description = "Django app that imports OpenStreetMap extracts into a PostGIS location hierarchy and serves them over a REST API."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Leszek Piątek", email = "lpiatek@gmail.com" }]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
keywords = ["django", "openstreetmap", "osm", "postgis", "gis", "geodjango"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]

# Core runtime: the models, admin and middleware only.
dependencies = [
    "Django>=4.2",
    "anyascii>=0.3",
    # progress reporting, used by the recalculate/merge management commands
    "tqdm>=4.60",
]

[project.optional-dependencies]
# REST API layer (django_osm_locations.api).
api = [
    "djangorestframework>=3.14",
    "djangorestframework-gis>=1.0",
    "django-filter>=2.0",
]

# OSM import pipeline (the locations_import management command).
importers = [
    "requests>=2.25",
    "Shapely>=1.8",
    "osmium>=3.6",
]

dev = [
    "django-osm-locations[api,importers]",
    "pytest>=7.0",
    "pytest-django>=4.5",
]

[project.urls]
Homepage = "https://bitbucket.org/iRynek/locations"
Source = "https://bitbucket.org/iRynek/locations"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
filterwarnings = ["error::SyntaxWarning"]
# The .pbf integration test parses a real extract and takes ~20s, needs a
# Python 3 build of imposm.parser and the extract itself, so it is opt-in:
#   pytest -m pbf
markers = ["pbf: parses a real OSM extract (slow, opt-in)"]
addopts = "-m 'not pbf'"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
django_osm_locations = ["fixtures/*.json"]
